<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata configuration for character encoding and responsive viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Nested Unordered List</title>
    <!-- Linking external CSS stylesheet for list presentation styling -->
    <link rel="stylesheet" href="./styles2.css">
</head>
<body>
    <!-- Top-level list for Fruits -->
    <ul>
        <li>Fruits</li>
        <!-- Nested list containing specific fruits -->
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Mango</li>
            <li>Orange</li>
        </ul>
    </ul>

    <!-- Top-level list for Vegetables -->
    <ul>
        <li>Vegetables</li>
        <!-- Nested list containing specific vegetables -->
        <ul>
            <li>Spinach</li>
            <li>Cauliflower</li>
            <li>Beetroot</li>
        </ul>
    </ul>

    <!-- Top-level list for Cereals -->
    <ul>
        <li>Cerals</li>
    </ul>

    <!-- Top-level list for Nuts -->
    <ul>
        <li>Nuts</li>
    </ul>  
</body>
</html>
